<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>筹码交易所 模拟小游戏</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>筹码交易所 模拟小游戏</h1>

  <!-- 模式选择 -->
  <div class="section">
    <div class="section-title">模式</div>
    <label>
      模式：
      <select id="modeSelect">
        <option value="easy">简单（起始 100 筹码）</option>
        <option value="normal">普通（起始 60 筹码）</option>
        <option value="hard">困难（起始 30 筹码）</option>
      </select>
    </label>
    <div style="margin-top: 8px;">
      当前筹码：<span id="chipsDisplay">0</span>
    </div>
  </div>

  <!-- 交易对 & 价格 -->
  <div class="section">
    <div class="section-title">交易对 & 当前价格</div>
    <label>
      交易对：
      <select id="symbolSelect">
        <option value="BTC-USDT">BTC-USDT</option>
        <option value="ETH-USDT">ETH-USDT</option>
      </select>
    </label>

    <div style="margin-top: 12px;">
      <span id="priceStatusLabel">当前价格加载中...</span>
    </div>
    <div id="priceBox" class="price-box">--</div>
    <small id="priceHint" class="hint-text">
      优先使用 OKX 实盘指数价格；若无法连接，将使用本地模拟价格，仅供娱乐。
    </small>

    <div style="margin-top: 10px;">
      <button id="retryPriceBtn" class="btn-secondary">
        尝试重新连接实盘价格
      </button>
    </div>
  </div>

  <!-- 本局信息 -->
  <div class="section">
    <div class="section-title">本局信息</div>

    <div>本局倒计时：<span id="countdownText">未开始</span></div>
    <div style="margin-top: 8px;">本局起始价：<span id="startPrice">--</span></div>
    <div style="margin-top: 8px;">本局结束价：<span id="endPrice">--</span></div>

    <div style="margin-top: 12px;">
      <label>
        本局下注筹码：
        <input id="betInput" type="number" min="1" step="1" value="10" />
      </label>
    </div>

    <div style="margin-top: 12px;">
      <span>选择方向：</span>
      <button id="btnUp" class="btn">猜涨</button>
      <button id="btnDown" class="btn btn-secondary" style="margin-left: 8px;">
        猜跌
      </button>
      <button
        id="resetAccountBtn"
        class="btn-secondary"
        style="float: right;"
      >
        重置账户
      </button>
    </div>
    <div style="clear: both;"></div>
  </div>

  <!-- 历史记录 -->
  <div class="section">
    <div class="section-title">历史记录</div>
    <table id="historyTable">
      <thead>
        <tr>
          <th>#</th>
          <th>时间</th>
          <th>方向</th>
          <th>起始价</th>
          <th>结束价</th>
          <th>下注</th>
          <th>结果</th>
          <th>盈亏</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div style="margin-top: 12px; text-align: right;">
      <button id="toggleAdvancedBtn" class="btn-secondary">
        显示高级功能
      </button>
    </div>
  </div>

  <!-- 高级功能：导出 / 导入账号 -->
  <div id="advancedSection" class="section hidden">
    <div class="section-title">高级功能 · 导出 / 导入账户</div>
    <p>
      导出会生成一串账号代码，请妥善保存；在任何设备导入后，可恢复当前筹码和历史记录。
    </p>

    <div style="margin-bottom: 10px;">
      <button id="exportBtn" class="btn">导出账号代码</button>
    </div>

    <div id="accountCodeBox" class="account-code hidden">
      <div style="margin-bottom: 6px;">你的账号代码：</div>
      <textarea id="accountCode" rows="3" readonly></textarea>
    </div>

    <div style="margin-top: 18px;">
      <div>输入账号代码导入：</div>
      <textarea
        id="accountCodeInput"
        rows="3"
        placeholder="在这里粘贴账号代码..."
      ></textarea>
      <button id="importBtn" class="btn" style="margin-top: 8px;">导入账号</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
